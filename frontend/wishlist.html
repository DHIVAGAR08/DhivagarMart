<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist - Dhivagar Mart Electronics</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.skipAutoAuthCheck = true;
  </script>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="logo-icon">🛒</span>
        <span>DHIVAGAR <span class="brand-tech">MART</span></span>
      </a>

      <!-- Search Bar -->
      <form class="nav-search-bar" onsubmit="handleSearch(event)">
        <select id="search-category-select" class="nav-search-category">
          <option value="All">All Categories</option>
          <option value="Smartphones">Smartphones</option>
          <option value="Apple iPhones">Apple iPhones</option>
          <option value="Smart Watches">Smart Watches</option>
          <option value="Wireless Earbuds">Wireless Earbuds</option>
        </select>
        <input type="text" id="nav-search-input" placeholder="Search electronics...">
        <button type="submit">🔍</button>
      </form>

      <ul class="nav-links">
        <li>
          <a href="wishlist.html" class="active">
            ❤️ Wishlist <span id="wishlist-badge" class="badge">0</span>
          </a>
        </li>
        <li>
          <a href="cart.html">
            🛒 Cart <span id="cart-badge" class="badge">0</span>
          </a>
        </li>
      </ul>

      <ul class="nav-links" id="nav-auth-container"></ul>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size:2rem; font-weight:800; color:var(--secondary); letter-spacing:-0.5px;">
        ❤️ Your Wishlist
      </h1>
      <p style="color:var(--text-muted); font-size:0.95rem;">
        Saved smartphones, wearables, and audio hardware ready to be added to your cart
      </p>
    </div>

    <div id="wishlist-container">
      <div style="text-align:center; padding:3rem; color:var(--text-muted);">
        <span style="font-size:2rem;">⏳</span><br>Loading your saved items...
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom" style="border:none; padding:0;">
      <p>© 2026 Dhivagar Mart India. All rights reserved. Premium Electronics & Gadgets.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
  <script>
    function handleSearch(e) {
      if (e) e.preventDefault();
      const term = document.getElementById('nav-search-input')?.value.trim() || '';
      window.location.href = `products.html?search=${encodeURIComponent(term)}`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuthState();
      loadWishlistPage();
      updateWishlistCount();
    });
  </script>
</body>
</html>
