<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Orders - Dhivagar Mart Electronics</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.skipAutoAuthCheck = true;
  </script>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="logo-icon">🛒</span>
        <span>DHIVAGAR <span class="brand-tech">MART</span></span>
      </a>

      <!-- Search Bar -->
      <form class="nav-search-bar" onsubmit="handleSearch(event)">
        <select id="search-category-select" class="nav-search-category">
          <option value="All">All Categories</option>
          <option value="Smartphones">Smartphones</option>
          <option value="Apple iPhones">Apple iPhones</option>
          <option value="Smart Watches">Smart Watches</option>
          <option value="Wireless Earbuds">Wireless Earbuds</option>
        </select>
        <input type="text" id="nav-search-input" placeholder="Search orders or products...">
        <button type="submit">🔍</button>
      </form>

      <ul class="nav-links">
        <li>
          <a href="wishlist.html">
            ❤️ Wishlist <span id="wishlist-badge" class="badge">0</span>
          </a>
        </li>
        <li>
          <a href="cart.html">
            🛒 Cart <span id="cart-badge" class="badge">0</span>
          </a>
        </li>
      </ul>

      <ul class="nav-links" id="nav-auth-container"></ul>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size:2rem; font-weight:800; color:var(--secondary); letter-spacing:-0.5px;">
        Your Orders
      </h1>
      <p style="color:var(--text-muted); font-size:0.95rem;">
        Track shipments, view detailed GST invoices, and manage warranties
      </p>
    </div>

    <div id="orders-container">
      <p style="color:var(--text-muted); text-align:center; padding:3rem;">
        <span style="font-size:2rem;">⏳</span><br>Loading your orders...
      </p>
    </div>
  </main>

  <!-- Order Details Modal -->
  <div id="order-details-modal" class="modal-overlay" style="display:none;">
    <div class="form-card" style="margin:0; width:92%; max-width:640px; box-shadow:var(--shadow-xl); max-height:90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; border-bottom:1px solid var(--border-color); padding-bottom:0.8rem;">
        <h2 id="modal-order-title" style="font-size:1.3rem; font-weight:800; color:var(--secondary);">Order Invoice & Summary</h2>
        <button onclick="closeOrderModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer;">✕</button>
      </div>
      <div id="modal-order-content"></div>
    </div>
  </div>

  <footer>
    <div class="footer-bottom" style="border:none; padding:0;">
      <p>© 2026 Dhivagar Mart India. All rights reserved. Premium Electronics & Gadgets.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script>
    function handleSearch(e) {
      if (e) e.preventDefault();
      const term = document.getElementById('nav-search-input')?.value.trim() || '';
      window.location.href = `products.html?search=${encodeURIComponent(term)}`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuthState();
      loadOrders();
      updateWishlistCount();
    });
  </script>
</body>
</html>
