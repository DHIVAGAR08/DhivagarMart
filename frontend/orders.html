<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Dhivagar Mart</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.skipAutoAuthCheck = true;
  </script>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="logo-icon">⚡</span>
        <span>Dhivagar <span class="brand-tech">Mart</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">All Products</a></li>
        <li>
          <a href="cart.html">
            🛒 Cart <span id="cart-badge" class="badge">0</span>
          </a>
        </li>
      </ul>
      <ul class="nav-links" id="nav-auth-container"></ul>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size:2rem; font-weight:800; color:var(--secondary); letter-spacing:-0.5px;">
        📦 My Tech Orders & Tracking
      </h1>
      <p style="color:var(--text-muted); font-size:0.95rem;">
        Track fulfillment, view invoices, and submit verified reviews
      </p>
    </div>

    <div id="orders-container">
      <p style="color:var(--text-muted); text-align:center; padding:3rem;">
        <span style="font-size:2rem;">⏳</span><br>Loading your orders...
      </p>
    </div>
  </main>

  <footer>
    <p>© 2026 Dhivagar Mart. Native C++20 Drogon Marketplace.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth();
      if (user) {
        loadOrders();
      }
    });
  </script>
</body>
</html>
