<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Dhivagar Mart Electronics</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.skipAutoAuthCheck = true;
  </script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body style="background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 100%); min-height: 100vh;">

  <!-- Header -->
  <header style="background: #131921; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="logo-icon">🛒</span>
        <span>DHIVAGAR <span class="brand-tech">MART</span></span>
      </a>
      <ul class="nav-links">
        <li>
          <a href="login.html" class="btn btn-secondary btn-sm" style="background:rgba(255,255,255,0.1); color:#ffffff; border-color:rgba(255,255,255,0.25);">
            Sign In
          </a>
        </li>
      </ul>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="auth-wrapper" style="display:flex; justify-content:center; align-items:center; padding:3rem 1.5rem; flex:1;">
    <div class="form-card" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(226, 232, 240, 0.2); max-width: 480px; width:100%; border-radius:var(--radius-md);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 52px; height: 52px; background: #eff6ff; color: #2563eb; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 0.8rem;">
          🚀
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px;">Create Your Account</h1>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.25rem;">
          Join Dhivagar Mart for exclusive member deals & warranty tracking
        </p>
      </div>

      <!-- Alerts -->
      <div id="register-error" style="display: none; background: var(--danger-light); color: var(--danger); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.9rem; border: 1px solid #fecaca; font-weight: 500;"></div>
      <div id="register-success" style="display: none; background: var(--success-light); color: #065f46; padding: 0.85rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.92rem; border: 1px solid #a7f3d0; font-weight: 600;"></div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" class="form-control" placeholder="First and last name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. name@example.com" required autocomplete="email">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="At least 6 chars" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem; font-weight: 700;">
          Create Dhivagar Mart Account
        </button>
      </form>

      <!-- Return to Login Link -->
      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.92rem; color: var(--text-muted);">
        Already have an account?
        <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 0.35rem;">
          Sign in here
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom" style="border:none; padding:0;">
      <p>© 2026 Dhivagar Mart India. All rights reserved. Premium Electronics & Gadgets.</p>
    </div>
  </footer>

  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      const errorDiv = document.getElementById('register-error');
      const successDiv = document.getElementById('register-success');
      const btn = document.getElementById('reg-btn');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match. Please verify your password entry.';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await api.register({ name, email, password, role: 'BUYER' });
        successDiv.textContent = 'Account created successfully! Redirecting...';
        successDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (err) {
        errorDiv.innerHTML = `
          <div style="font-weight:600; margin-bottom:0.4rem;">${err.message || 'Registration failed.'}</div>
          <div style="margin-top:0.6rem;">
            <a href="index.html" class="btn btn-secondary btn-sm" style="background:#ffffff; color:#0f172a; border:1px solid #cbd5e1; font-weight:700; text-decoration:none; display:inline-block; padding:0.4rem 0.8rem;">
              Continue to Store as Guest →
            </a>
          </div>
        `;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Dhivagar Mart Account';
      }
    }
  </script>
</body>
</html>
