# ============================================================
# DHIVAGAR MART — RENDER BLUEPRINT SPECIFICATION
# Deploy C++20 Drogon Web Service
# ============================================================

services:
  - type: web
    name: dhivagarmart
    env: docker
    dockerfilePath: ./Dockerfile
    branch: main
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_TIMEOUT_SECONDS
        value: "1200"
      - key: AI_PROVIDER
        value: mock
